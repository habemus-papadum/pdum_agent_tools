name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.17"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install workspace
        run: uv sync --frozen --all-packages --all-extras
      - name: Lint and format checks
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Verify package imports
        run: uv run --frozen --all-packages python -c "import pdum.mitm; import pdum.codex_launcher; import pdum.hostfork; import pdum.claude_launcher"
      - name: Run local integration and unit tests
        run: uv run --frozen --all-packages --all-extras pytest -m "not live" --cov --cov-report=xml --cov-report=term
      - name: Upload coverage
        if: ${{ hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
      - name: Build documentation
        if: ${{ matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest' }}
        run: uv run --frozen mkdocs build --strict
      - name: Build workspace distributions
        if: ${{ matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest' }}
        run: uv build --all-packages
      - name: Upload distributions
        if: ${{ matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
