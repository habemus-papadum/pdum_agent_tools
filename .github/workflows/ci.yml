name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # ship's version-marker check reads the release tags
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.17"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install workspace
        run: uv sync --frozen --all-packages --all-extras
      - name: Release policy check
        run: uv run --frozen ship deps check
      - name: Lint and format checks
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Verify package imports
        run: uv run --frozen --all-packages python -c "import pdum.mitm; import pdum.codex_launcher; import pdum.hostfork; import pdum.claude_launcher; import pdum.agent_history; import pdum.orchestrator"
      - name: Run local integration and unit tests
        run: uv run --frozen --all-packages --all-extras pytest -m "not live" --cov --cov-report=xml --cov-report=term
      - name: Upload coverage
        if: ${{ hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
      - name: Build documentation
        if: ${{ matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest' }}
        run: uv run --frozen mkdocs build --strict
      - name: Build workspace distributions
        if: ${{ matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest' }}
        run: uv build --all-packages
      - name: Upload distributions
        if: ${{ matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  typescript:
    name: TypeScript workspace and orchestrator development stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v5
      - name: Check out the qualified AIUI source
        uses: actions/checkout@v5
        with:
          repository: habemus-papadum/pdum_aiui
          ref: e17191ff19447121882b19de890739cc8b9f6835
          path: .dev/aiui
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.17"
          python-version: "3.14"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"
      - uses: actions/setup-node@v5
        with:
          node-version-file: typescript/.nvmrc
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Install (frozen lockfile)
        working-directory: .
        run: |
          uv sync --frozen --all-packages --all-extras
          pnpm --dir .dev/aiui install --frozen-lockfile --filter @habemus-papadum/aiui-viz... --filter @habemus-papadum/aiui-design... --filter @habemus-papadum/aiui-source-processor... --filter @habemus-papadum/aiui-prompts...
          pnpm --dir typescript install --frozen-lockfile
      - name: Lint and format check (Biome)
        run: pnpm lint
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm -r build
      - name: Schema contract matches the Python package
        working-directory: .
        run: |
          uv run --frozen pdum-history schema --json > "$RUNNER_TEMP/schema.json"
          diff "$RUNNER_TEMP/schema.json" typescript/packages/agent-history/schema/agent-history.schema.json

  claude-clients:
    name: Claude official Node SDK / native launcher (credential-free)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.17"
          python-version: "3.14"
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: "26.10.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"
      - name: Install workspace and pinned official client example
        run: |
          uv sync --frozen --all-packages --all-extras
          pnpm --dir examples/claude-client install --frozen-lockfile
          pnpm --dir examples/claude-client build
      - name: Install pinned native Claude on the disposable runner
        env:
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        # Official versioned native installer: https://code.claude.com/docs/en/setup#install-a-specific-version
        run: |
          curl -fsSL https://claude.ai/install.sh -o "$RUNNER_TEMP/install-claude.sh"
          bash "$RUNNER_TEMP/install-claude.sh" 2.1.296
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          test "$("$HOME/.local/bin/claude" --version)" = "2.1.296 (Claude Code)"
      - name: Check credential-free concurrent SDK controls and worker cleanup
        run: uv run --frozen --all-packages --all-extras python scripts/check_claude_clients.py --clients 4 --rounds 2 --timeout 120
      - name: Check native profile and instruction isolation
        run: uv run --frozen --all-packages --all-extras pytest packages/claude-launcher/tests/test_profiles_native.py -m "not live"
