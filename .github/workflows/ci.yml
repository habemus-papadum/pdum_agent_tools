name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.17"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install workspace
        run: uv sync --frozen --all-packages --all-extras
      - name: Lint and format checks
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Verify package imports
        run: uv run --frozen --all-packages python -c "import pdum.mitm; import pdum.codex_launcher; import pdum.hostfork; import pdum.claude_launcher"
      - name: Run local integration and unit tests
        run: uv run --frozen --all-packages --all-extras pytest -m "not live" --cov --cov-report=xml --cov-report=term
      - name: Upload coverage
        if: ${{ hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
      - name: Build documentation
        if: ${{ matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest' }}
        run: uv run --frozen mkdocs build --strict
      - name: Build workspace distributions
        if: ${{ matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest' }}
        run: uv build --all-packages
      - name: Upload distributions
        if: ${{ matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  claude-clients:
    name: Claude official Node SDK / native launcher (credential-free)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.17"
          python-version: "3.14"
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: "26.10.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"
      - name: Install workspace and pinned official client example
        run: |
          uv sync --frozen --all-packages --all-extras
          pnpm --dir examples/claude-client install --frozen-lockfile
          pnpm --dir examples/claude-client build
      - name: Install pinned native Claude on the disposable runner
        env:
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        # Official versioned native installer: https://code.claude.com/docs/en/setup#install-a-specific-version
        run: |
          curl -fsSL https://claude.ai/install.sh -o "$RUNNER_TEMP/install-claude.sh"
          bash "$RUNNER_TEMP/install-claude.sh" 2.1.296
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          test "$("$HOME/.local/bin/claude" --version)" = "2.1.296 (Claude Code)"
      - name: Check credential-free concurrent SDK controls and worker cleanup
        run: uv run --frozen --all-packages --all-extras python scripts/check_claude_clients.py --clients 4 --rounds 2 --timeout 120
      - name: Check native profile and instruction isolation
        run: uv run --frozen --all-packages --all-extras pytest packages/claude-launcher/tests/test_profiles_native.py -m "not live"
