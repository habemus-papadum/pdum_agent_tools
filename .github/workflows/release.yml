name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Release size relative to the last release tag
        type: choice
        options: [patch, minor, major]
        default: minor
      skip_ci_check:
        description: Override the CI gate
        type: boolean
        default: false
      dry_run:
        description: Show version changes without committing, tagging, or publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.17"
      - name: Check publishing credential
        if: ${{ !inputs.dry_run }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "::error::Configure the PYPI_API_TOKEN repository secret before releasing."
            exit 1
          fi
      - name: Require successful CI for this commit
        if: ${{ !inputs.skip_ci_check }}
        env:
          SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 60); do
            row=$(gh run list --workflow ci.yml --commit "$SHA" --event push --limit 1 \
              --json status,conclusion --jq '.[0] | select(. != null) | [.status, (.conclusion // "")] | @tsv')
            IFS=$'\t' read -r status conclusion <<< "$row"
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then exit 0; fi
              echo "::error::CI concluded $conclusion."
              exit 1
            fi
            echo "Waiting for CI ($attempt/60)."
            sleep 30
          done
          echo "::error::Timed out waiting for CI."
          exit 1
      - name: Compute and prepare the lockstep version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          uv lock --check
          last_tag=$(git tag --list 'v*' --sort=-version:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')
          baseline=${last_tag#v}
          baseline=${baseline:-0.0.0}
          for package in habemus-papadum-mitm habemus-papadum-codex-launcher; do
            current=$(uv version --package "$package" --short --frozen)
            if [ "$current" != "$baseline+dev" ]; then
              echo "::error::$package has $current; expected $baseline+dev."
              exit 1
            fi
            uv version --package "$package" "$baseline" --frozen
          done
          version=$(uv version --package habemus-papadum-mitm --bump "$BUMP" --short --frozen)
          uv version --package habemus-papadum-codex-launcher "$version" --frozen
          uv lock
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          git --no-pager diff -- packages/mitm/pyproject.toml packages/codex-launcher/pyproject.toml
          echo "Prepared v$version; dry-run mode: ${{ inputs.dry_run }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit and tag the release
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/mitm/pyproject.toml packages/codex-launcher/pyproject.toml uv.lock
          git commit -m "$VERSION"
          git tag -a "$TAG" -m "$VERSION"
          git push --atomic origin HEAD:main "refs/tags/$TAG"
      - name: Build from the release commit
        if: ${{ !inputs.dry_run }}
        run: uv build --all-packages
      - name: Preserve release artifacts
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v6
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
      - name: Publish both packages to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: true
          attestations: false
      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --generate-notes dist/*
      - name: Restore development versions
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for package in habemus-papadum-mitm habemus-papadum-codex-launcher; do
            uv version --package "$package" "$VERSION+dev" --frozen
          done
          uv lock
          git add packages/mitm/pyproject.toml packages/codex-launcher/pyproject.toml uv.lock
          git commit -m "back to dev ($VERSION+dev)"
          git push origin HEAD:main
