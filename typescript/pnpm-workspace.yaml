packages:
  - "packages/*"
  - "tools/*"
  - "apps/*"

# Every dependency version lives here; manifests say `"catalog:"`. Strict mode
# rejects a literal range in a manifest, so adding a dependency means adding a
# pin below first. Pins are exact: this workspace ships CLIs, not libraries that
# must float with a host application.
catalogMode: strict
linkWorkspacePackages: true
preferWorkspacePackages: true

catalog:
  "@habemus-papadum/agent-core": 0.1.0+dev
  "@habemus-papadum/orchestrator-client": 0.1.0+dev
  "@habemus-papadum/agent-history": 0.1.0+dev
  "@habemus-papadum/aiui-viz": 0.23.0+dev
  "@habemus-papadum/aiui-design": 0.23.0+dev
  "@habemus-papadum/aiui-source-processor": 0.23.0+dev
  "@habemus-papadum/aiui-prompts": 0.23.0+dev
  "@solidjs/web": 2.0.0-rc.13
  "@solidjs/signals": 2.0.0-rc.13
  "solid-js": 2.0.0-rc.13
  "vite-plugin-solid": 3.0.0-next.27
  "@solidjs/vite-plugin": 3.0.0-next.47
  "@solidjs/babel-plugin": 2.0.0-rc.13
  "@solidjs/compiler": 2.0.0-rc.13
  "@babel/core": 7.29.7
  jsdom: 29.0.0
  "@biomejs/biome": 2.5.15
  "@duckdb/node-api": 1.5.6-r.1
  "@types/node": 26.6.5
  commander: 15.0.0
  tsx: 4.23.15
  typedoc: 0.28.20
  typedoc-plugin-markdown: 4.13.1
  typescript: 7.0.2
  vite: 8.3.4
  vitest: 5.0.3

# TypeDoc 0.28 reads the TypeScript 5 compiler API and crashes on TypeScript 7, so the
# api-docs tool resolves its own TypeScript through this named catalog.
catalogs:
  typedoc:
    typescript: 5.9.3

# pnpm blocks dependency build scripts by default; allow the ones we trust.
allowBuilds:
  esbuild: true

overrides:
  "@solidjs/signals": "catalog:"
  "@solidjs/vite-plugin": "catalog:"
  "@solidjs/babel-plugin": "catalog:"
  "@solidjs/compiler": "catalog:"
  "@habemus-papadum/agent-core": "link:./packages/agent-core"
  "@habemus-papadum/orchestrator-client": "link:./packages/orchestrator-client"
  "@habemus-papadum/agent-history": "link:./packages/agent-history"
  # Local source-first development; pnpm catalogs cannot contain link: entries.
  "@habemus-papadum/aiui-viz": "link:../.dev/aiui/packages/aiui-viz"
  "@habemus-papadum/aiui-design": "link:../.dev/aiui/packages/aiui-design"
  "@habemus-papadum/aiui-source-processor": "link:../.dev/aiui/packages/aiui-source-processor"
  "@habemus-papadum/aiui-prompts": "link:../.dev/aiui/packages/aiui-prompts"
