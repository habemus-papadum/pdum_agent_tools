packages:
  - "packages/*"
  - "tools/*"

# Every dependency version lives here; manifests say `"catalog:"`. Strict mode
# rejects a literal range in a manifest, so adding a dependency means adding a
# pin below first. Pins are exact: this workspace ships CLIs, not libraries that
# must float with a host application.
catalogMode: strict

catalog:
  "@biomejs/biome": 2.5.15
  "@duckdb/node-api": 1.5.6-r.1
  "@types/node": 26.6.5
  commander: 15.0.0
  tsx: 4.23.15
  typedoc: 0.28.20
  typedoc-plugin-markdown: 4.13.1
  typescript: 7.0.2
  vite: 8.3.4
  vitest: 5.0.3

# TypeDoc 0.28 reads the TypeScript 5 compiler API and crashes on TypeScript 7, so the
# api-docs tool resolves its own TypeScript through this named catalog.
catalogs:
  typedoc:
    typescript: 5.9.3

# pnpm blocks dependency build scripts by default; allow the ones we trust.
allowBuilds:
  esbuild: true
