[tool.uv.workspace]
members = ["packages/*"]
exclude = ["experiments"]

[tool.uv.sources]
habemus-papadum-mitm = { workspace = true }
habemus-papadum-codex-launcher = { workspace = true }
habemus-papadum-hostfork = { workspace = true }

[dependency-groups]
dev = [
    "aiohttp>=3.12,<4",
    "httpx>=0.28,<1",
    "hatch>=1.14.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.3",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.0",
    "mkdocstrings>=0.26.1",
    "mkdocstrings-python>=1.11.1",
    "pre-commit>=3.7.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["packages/mitm/tests", "packages/codex-launcher/tests", "packages/hostfork/tests"]
addopts = "-s --import-mode=importlib"
asyncio_mode = "auto"
markers = [
    "codex: requires an installed Codex executable, with isolated state and no paid calls",
    "live: opt-in paid provider integration using isolated credentials and a bounded budget",
    "hostfork_linux: requires Linux namespaces, a systemd user manager and cgroup v2",
    "hostfork_btrfs: requires an explicitly prepared disposable Btrfs test pool",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["pdum.mitm", "pdum.codex_launcher", "pdum.hostfork"]
relative_files = true
patch = ["subprocess"]
parallel = true
omit = ["*/tests/*", "*/testing.py"]
