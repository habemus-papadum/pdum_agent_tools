[project]
name = "habemus-papadum-codex-launcher"
version = "0.1.0+dev"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Nehal Patel", email = "nehal@alum.mit.edu" }]
dependencies = [
    "click>=8.1,<9",
    "platformdirs>=4,<5",
    "psutil>=6,<8",
    "questionary>=2.1,<3",
    "rich>=14,<16",
    "tomlkit>=0.13,<1",
    "typer>=0.16,<1",
    "websockets>=15,<17",
]

[project.scripts]
pdum-codex = "pdum.codex_launcher.cli:app"

[project.optional-dependencies]
mitm = ["habemus-papadum-mitm"]
management = ["fastapi>=0.115,<1"]
federation = ["httpx>=0.28,<1"]

[project.urls]
Repository = "https://github.com/habemus-papadum/pdum_agent_tools"
Documentation = "https://habemus-papadum.github.io/pdum_agent_tools/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdum"]
