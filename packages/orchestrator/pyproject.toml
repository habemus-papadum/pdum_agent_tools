[project]
name = "habemus-papadum-orchestrator"
version = "0.0.0+dev"
description = "Foreground host coordination for agent launchers and development instances"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Nehal Patel", email = "nehal@alum.mit.edu" }]
dependencies = ["psutil>=6,<8", "rich>=14,<16", "typer>=0.16,<1"]

[project.scripts]
pdum-orchestrator = "pdum.orchestrator.cli:app"

[project.optional-dependencies]
management = ["fastapi>=0.115,<1", "uvicorn>=0.35,<1"]

[project.urls]
Repository = "https://github.com/habemus-papadum/pdum_agent_tools"
Documentation = "https://habemus-papadum.github.io/pdum_agent_tools/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdum"]
