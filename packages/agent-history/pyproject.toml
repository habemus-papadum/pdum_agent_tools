[project]
name = "habemus-papadum-agent-history"
version = "0.1.0+dev"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Nehal Patel", email = "nehal@alum.mit.edu" }]
dependencies = [
    "duckdb>=1.5,<2",
    "platformdirs>=4,<5",
    "pyarrow>=20,<27",
    "rich>=14,<16",
    "typer>=0.16,<1",
]

[project.scripts]
pdum-history = "pdum.agent_history.cli:app"

[project.urls]
Repository = "https://github.com/habemus-papadum/pdum_agent_tools"
Documentation = "https://habemus-papadum.github.io/pdum_agent_tools/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdum"]
