[project]
name = "habemus-papadum-hostfork"
version = "0.1.0"
description = "Host-derived environments with independent process ownership and recoverable private storage"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Nehal Patel", email = "nehal@alum.mit.edu" }]
dependencies = [
    "dbus-next>=0.2.3,<0.3; sys_platform == 'linux'",
    "rich>=14,<16",
    "typer>=0.16,<1",
]

[project.scripts]
pdum-hostfork = "pdum.hostfork.cli:app"

[project.urls]
Repository = "https://github.com/habemus-papadum/pdum_agent_tools"
Documentation = "https://habemus-papadum.github.io/pdum_agent_tools/hostfork/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdum"]
