[project]
name = "habemus-papadum-mitm"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Nehal Patel", email = "nehal@alum.mit.edu" }]
dependencies = [
    "certifi>=2025.1.31",
    "mitmproxy==12.2.3",
    "typer>=0.16,<1",
]

[project.scripts]
pdum-mitm = "pdum.mitm.cli:app"

[project.urls]
Repository = "https://github.com/habemus-papadum/pdum_agent_tools"
Documentation = "https://habemus-papadum.github.io/pdum_agent_tools/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdum"]
