site_name: pdum_agent_tools
site_author: Nehal Patel
site_url: https://habemus-papadum.github.io/pdum_agent_tools/
repo_url: https://github.com/habemus-papadum/pdum_agent_tools
repo_name: pdum_agent_tools
docs_dir: docs

theme:
  name: material
  palette:
    primary: blue grey

nav:
  - Home: index.md
  - Development: development.md
  - Implementation status: implementation-status.md
  - Profile setup and authentication: profiles.md
  - Hostfork:
      - Operator and API guide: hostfork.md
      - Validation and limits: hostfork-validation.md
  - Testing: testing.md
  - Research and spikes: research.md
  - Architecture proposals:
      - Overview: architecture.md
      - Agreed design principles: design-principles.md
      - Codex launcher: specs/codex-launcher.md
      - MITM sidecar: specs/mitm.md
      - Hostfork:
          - Architecture: specs/hostfork/architecture.md
          - Motivation and direction: specs/hostfork/motivation.md
          - Host compatibility and storage: specs/hostfork/host-compatibility.md
          - Measured spike findings: specs/hostfork/spike-findings.md
          - Earlier design exploration: specs/hostfork/design-notes.md
  - Implementation plans:
      - Joint sequence: plans/implementation.md
      - Codex launcher: plans/codex-launcher.md
      - MITM sidecar: plans/mitm.md
      - Hostfork: plans/hostfork.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [packages/mitm/src, packages/codex-launcher/src, packages/hostfork/src]
          options:
            docstring_style: numpy
            show_submodules: true
