      - Hostfork: plans/hostfork.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [packages/mitm/src, packages/codex-launcher/src, packages/hostfork/src, packages/claude-launcher/src, packages/agent-history/src]
          options:
            docstring_style: numpy
            show_submodules: true
