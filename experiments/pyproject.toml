[project]
name = "agent-spike-workspace"
version = "0.0.0"
description = "Python workspace for remote agent CLI experiments"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.uv]
package = false
constraint-dependencies = ["mitmproxy==12.2.3"]
build-constraint-dependencies = ["hatchling==1.32.4"]

[tool.uv.workspace]
members = ["python/*", "spikes/*/python"]

[tool.pytest.ini_options]
testpaths = ["spikes/020-hostfork-runtime/python/tests", "spikes/024-hostfork-scope/python/tests"]
