<!doctype html><meta charset="utf-8"><title>Codex remote terminal and image probe</title>
<style>body{font:16px system-ui;max-width:900px;margin:32px auto}input{width:80%;padding:8px}button{margin:8px;padding:8px}pre{background:#eee;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere}label{display:block}</style>
<h1>Remote terminal and image probe</h1>
<p id="status">Disconnected</p><button id="connect">Connect</button><button id="disconnect">Disconnect</button>
<h2>Terminal</h2><label>Shell command <input id="command" value="printf 'browser terminal OK\n'; stty size; cat"></label>
<button id="terminal">Start PTY</button><label>stdin <input id="stdin" value="hello from browser"></label><button id="send">Send line</button><button id="resize">Resize to 30 × 100</button><button id="terminate">Terminate</button>
<pre id="output"></pre>
<h2>Image</h2><p>One image prompt uses gpt-6-luna; no fallback.</p><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><label>Image prompt <input id="prompt" value="What color is this image? Answer one word. Do not use tools."></label><button id="demo">Use red demo image</button><button id="image">Submit image</button>
<pre id="reply"></pre><h2>History and join</h2><label>Thread ID <input id="threadId"></label><button id="readHistory">Read history</button><button id="resume">Resume thread</button><pre id="history"></pre><h2>Protocol</h2><pre id="wire"></pre>
<script>
const config=__CONFIG__;let ws,id=0,pending=new Map(),processId,threadId,demoUrl;const $=s=>document.querySelector(s);
function log(m){$('#wire').textContent+=JSON.stringify(m)+'\n'}
function rpc(method,params){const n=++id;const m={id:n,method,params};log(m);return new Promise((resolve,reject)=>{pending.set(n,{resolve,reject});ws.send(JSON.stringify(m))})}
function action(fn){return async()=>{try{await fn()}catch(e){$('#status').textContent='Error: '+e.message}}}
$('#connect').onclick=action(async()=>{ws=new WebSocket(config.endpoint);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});ws.onmessage=e=>{const m=JSON.parse(e.data);log(m);if(m.id!==undefined&&!m.method){const p=pending.get(m.id);pending.delete(m.id);m.error?p?.reject(Error(m.error.message)):p?.resolve(m.result)}if(m.method==='command/exec/outputDelta'){$('#output').textContent+=new TextDecoder().decode(Uint8Array.from(atob(m.params.deltaBase64),c=>c.charCodeAt(0)))}if(m.method==='item/agentMessage/delta')$('#reply').textContent+=m.params.delta};ws.onclose=()=>$('#status').textContent='Disconnected';await rpc('initialize',{clientInfo:{name:'spike030-browser',version:'0.0.0'},capabilities:{experimentalApi:true}});ws.send(JSON.stringify({method:'initialized',params:{}}));$('#status').textContent='Connected';});
$('#disconnect').onclick=()=>ws?.close();
$('#terminal').onclick=action(async()=>{processId='browser-'+Date.now();$('#output').textContent='';const r=await rpc('command/exec',{command:['/bin/sh','-c',$('#command').value],cwd:config.cwd,processId,tty:true,size:{rows:20,cols:70},timeoutMs:120000});$('#output').textContent+='\nExit '+r.exitCode});
$('#send').onclick=action(()=>rpc('command/exec/write',{processId,deltaBase64:btoa(unescape(encodeURIComponent($('#stdin').value+'\n')))}));
$('#resize').onclick=action(()=>rpc('command/exec/resize',{processId,size:{rows:30,cols:100}}));
$('#terminate').onclick=action(()=>rpc('command/exec/terminate',{processId}));
$('#file').onchange=()=>{demoUrl=undefined};
$('#demo').onclick=()=>{const c=document.createElement('canvas');c.width=c.height=16;const ctx=c.getContext('2d');ctx.fillStyle='#ff0000';ctx.fillRect(0,0,16,16);demoUrl=c.toDataURL('image/png');$('#reply').textContent='Red 16 × 16 browser fixture ready'};
$('#image').onclick=action(async()=>{if(!config.auth)throw Error('Harness started without --auth');const file=$('#file').files[0];if(!file&&!demoUrl)throw Error('Choose an image or demo');const url=demoUrl??await new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=j;f.readAsDataURL(file)});if(!threadId){const t=await rpc('thread/start',{cwd:config.cwd,model:'gpt-6-luna',approvalPolicy:'never',sandbox:'danger-full-access'});threadId=t.thread.id;$('#threadId').value=threadId}$('#reply').textContent='';await rpc('turn/start',{threadId,input:[{type:'text',text:$('#prompt').value},{type:'image',url}],model:'gpt-6-luna',effort:'low'});});
$('#readHistory').onclick=action(async()=>{$('#history').textContent=JSON.stringify(await rpc('thread/read',{threadId:$('#threadId').value,includeTurns:true}),null,2)});
$('#resume').onclick=action(async()=>{threadId=$('#threadId').value;$('#history').textContent=JSON.stringify(await rpc('thread/resume',{threadId,excludeTurns:false}),null,2)});
window.probe={rpc,config};
</script>
