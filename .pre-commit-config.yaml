repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^experiments/.*\.patch$
      - id: end-of-file-fixer
        exclude: ^experiments/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
  - repo: local
    hooks:
      - id: ruff
        name: Lint Python with ruff
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
        exclude: ^experiments/
      - id: ruff-format
        name: Format Python with ruff
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
        exclude: ^experiments/
  # ship: rejects development links (path/editable uv sources), stale lockfiles and
  # stale skill copies. Runs the ship pinned in uv.lock, so nothing here changes when
  # ship releases.
  - repo: local
    hooks:
      - id: ship-check
        name: ship deps check (development links, lockfiles, skill copies)
        entry: uv run --locked ship deps check --hook
        language: system
        pass_filenames: false
        always_run: true
